<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StormNorm Weather</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        glass: 'rgba(255, 255, 255, 0.75)',
                        glassDark: 'rgba(30, 41, 59, 0.75)',
                        glassBorder: 'rgba(255, 255, 255, 0.6)',
                        glassBorderDark: 'rgba(255, 255, 255, 0.1)',
                    }
                }
            }
        }
    </script>

    <style>
        body { background-color: #e0f2fe; transition: background-color 0.5s ease, color 0.5s ease; }
        body.dark { background-color: #0f172a; }

        .weather-bg {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: -10; overflow: hidden; pointer-events: none !important;
        }

        .cloud {
            position: absolute; background: rgba(255, 255, 255, 0.85);
            border-radius: 50px; filter: blur(6px); animation: float 45s linear infinite;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.03);
        }
        .dark .cloud { background: rgba(71, 85, 105, 0.35); box-shadow: none; }
        .cloud::before, .cloud::after {
            content: ''; position: absolute; background: inherit; border-radius: 50%;
        }

        .cloud1 { width: 320px; height: 110px; top: 12%; left: -350px; animation-duration: 55s; }
        .cloud1::before { width: 140px; height: 140px; top: -65px; left: 45px; }
        .cloud1::after { width: 110px; height: 110px; top: -45px; right: 45px; }

        .cloud2 { width: 220px; height: 80px; top: 45%; left: -250px; animation-duration: 38s; animation-delay: -15s; transform: scale(0.85); opacity: 0.9; }
        .cloud2::before { width: 100px; height: 100px; top: -45px; left: 35px; }
        .cloud2::after { width: 80px; height: 80px; top: -35px; right: 35px; }

        @keyframes float { 0% { transform: translateX(0); } 100% { transform: translateX(125vw); } }

        .rain {
            position: absolute; width: 2px; height: 40px;
            background: linear-gradient(transparent, rgba(59, 130, 246, 0.6));
            animation: rainDrop 1s linear infinite;
        }
        .dark .rain { background: linear-gradient(transparent, rgba(148, 163, 184, 0.6)); }
        @keyframes rainDrop { 0% { transform: translateY(-100px); opacity: 0; } 50% { opacity: 1; } 100% { transform: translateY(100vh); opacity: 0; } }

        .glass-panel {
            background: var(--glass-bg, rgba(255, 255, 255, 0.75));
            backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border, rgba(255, 255, 255, 0.6));
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04);
            transition: background 0.5s ease, border 0.5s ease;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.4); backdrop-filter: blur(4px);
            z-index: 50; display: none; align-items: center; justify-content: center;
            opacity: 0; transition: opacity 0.3s ease;
        }
        .modal-overlay.active { display: flex; opacity: 1; }
        
        .loader {
            border: 3px solid #f3f3f3; border-top: 3px solid #3b82f6; border-radius: 50%;
            width: 20px; height: 20px; animation: spin 1s linear infinite; display: inline-block;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="min-h-screen flex flex-col font-sans overflow-x-hidden relative text-slate-800 dark:text-slate-100">
    
    <div class="weather-bg" id="weatherBg">
        <div class="cloud cloud1"></div>
        <div class="cloud cloud2"></div>
    </div>

    <header class="w-full max-w-6xl mx-auto p-6 flex justify-between items-center z-10 mt-2">
        <div class="flex items-center gap-3">
            <i class="fa-solid fa-bolt text-blue-500 text-2xl drop-shadow-sm"></i>
            <h1 class="text-2xl font-bold tracking-tight text-slate-800 dark:text-white">StormNorm</h1>
        </div>
        <button id="themeToggle" class="w-10 h-10 rounded-full glass-panel flex items-center justify-center hover:scale-105 transition-transform cursor-pointer shadow-sm">
            <i class="fa-solid fa-moon text-slate-600 dark:text-slate-300 text-lg" id="themeIcon"></i>
        </button>
    </header>

    <main class="w-full max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 pb-10 z-10 grid grid-cols-1 xl:grid-cols-12 gap-8 items-start">
        
        <!-- Weather Panel (Col 1-7) -->
        <div class="w-full xl:col-span-7 glass-panel rounded-3xl p-6 sm:p-8 flex flex-col justify-between" style="--glass-bg: theme('colors.glass'); --glass-border: theme('colors.glassBorder'); min-height: 560px;">
            
            <div class="relative w-full mb-8">
                <i class="fa-solid fa-location-dot absolute left-5 top-1/2 transform -translate-y-1/2 text-slate-400"></i>
                <input type="text" id="cityInput" placeholder="Search any city (e.g., Windhoek, Tokyo)..." class="w-full bg-white/60 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 rounded-full py-3.5 pl-12 pr-28 focus:outline-none focus:ring-2 focus:ring-blue-400 text-sm placeholder-slate-400 dark:placeholder-slate-500 transition-colors shadow-inner text-slate-800 dark:text-slate-100">
                <button id="searchBtn" class="absolute right-1.5 top-1.5 bottom-1.5 bg-blue-600 hover:bg-blue-700 text-white rounded-full px-6 text-sm font-semibold transition-colors shadow-md cursor-pointer">Search</button>
            </div>

            <div class="flex flex-col sm:flex-row justify-between items-center sm:items-stretch mb-8 gap-6 w-full px-2">
                <div class="flex flex-col justify-between text-center sm:text-left">
                    <div>
                        <h2 id="cityName" class="text-4xl sm:text-[42px] font-bold text-slate-800 dark:text-white leading-none mb-2">Windhoek</h2>
                        <p id="countryName" class="text-lg text-slate-500 dark:text-slate-400">Namibia</p>
                    </div>
                    <p id="currentDate" class="text-sm text-slate-400 dark:text-slate-500 mt-4 sm:mt-0">Loading...</p>
                </div>

                <div class="flex flex-col items-center justify-center">
                    <i id="mainWeatherIcon" class="fa-solid fa-sun text-yellow-400 text-[70px] drop-shadow-lg mb-2 transition-all duration-300"></i>
                    <span id="weatherDescription" class="text-base font-bold text-slate-700 dark:text-slate-200">Loading...</span>
                </div>

                <div class="flex flex-col justify-between items-center sm:items-end">
                    <h3 id="currentTemp" class="text-6xl sm:text-[64px] font-bold text-slate-800 dark:text-white leading-none mb-4 sm:mb-0">--°<span class="text-3xl text-slate-400 font-normal">C</span></h3>
                    
                    <div class="flex gap-6 mt-auto">
                        <div class="flex flex-col items-center">
                            <span class="text-[10px] text-slate-400 uppercase tracking-widest mb-1 font-semibold">Wind</span>
                            <div class="flex items-center gap-1.5 font-medium text-sm text-slate-700 dark:text-slate-300">
                                <i class="fa-solid fa-wind text-blue-400"></i>
                                <span id="windSpeed">--</span>
                            </div>
                        </div>
                        <div class="flex flex-col items-center">
                            <span class="text-[10px] text-slate-400 uppercase tracking-widest mb-1 font-semibold">Humidity</span>
                            <div class="flex items-center gap-1.5 font-medium text-sm text-slate-700 dark:text-slate-300">
                                <i class="fa-solid fa-droplet text-blue-400"></i>
                                <span id="humidity">--</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="mt-4 pt-4 border-t border-slate-200/50 dark:border-slate-700/50">
                <div class="flex items-center justify-between mb-3">
                    <h4 class="text-xs text-slate-400 dark:text-slate-500 uppercase tracking-widest font-bold">7-Day Forecast</h4>
                    <span class="text-[10px] text-slate-400 italic">Click a day for details</span>
                </div>
                <div class="flex justify-between gap-2 overflow-x-auto no-scrollbar pb-1" id="forecastContainer"></div>
            </div>
        </div>

        <!-- Chat Panel (Col 8-12) -->
        <div class="w-full xl:col-span-5 glass-panel rounded-3xl flex flex-col h-[560px] relative" style="--glass-bg: theme('colors.glass'); --glass-border: theme('colors.glassBorder');">
            
            <div class="p-4 border-b border-white/40 dark:border-slate-700/40 flex items-center gap-3 bg-white/30 dark:bg-slate-800/30 rounded-t-3xl flex-shrink-0">
                <div class="w-10 h-10 rounded-full bg-blue-500 flex items-center justify-center text-white shadow-md shadow-blue-500/30">
                    <i class="fa-solid fa-robot text-lg"></i>
                </div>
                <div>
                    <h3 class="font-bold text-base leading-tight text-slate-800 dark:text-white">Aura AI</h3>
                    <div class="flex items-center gap-1.5">
                        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                        <span class="text-xs text-slate-500 dark:text-slate-400 font-medium">Online</span>
                    </div>
                </div>
            </div>

            <div id="chatArea" class="flex-grow p-5 overflow-y-auto flex flex-col gap-3.5 no-scrollbar scroll-smooth">
                <div class="flex gap-3 max-w-[85%]">
                    <div class="w-8 h-8 rounded-full bg-blue-500 flex-shrink-0 flex items-center justify-center shadow-sm">
                        <i class="fa-solid fa-robot text-white text-xs"></i>
                    </div>
                    <div class="bg-white/90 dark:bg-slate-700/90 p-3.5 rounded-2xl rounded-tl-none shadow-sm text-sm border border-white/50 dark:border-slate-600/50 text-slate-700 dark:text-slate-200 leading-relaxed">
                        Hello! I'm Aura, your AI weather assistant powered by Gemini. How can I help you today?
                    </div>
                </div>
            </div>

            <div class="p-4 border-t border-white/40 dark:border-slate-700/40 bg-white/20 dark:bg-slate-800/20 rounded-b-3xl flex-shrink-0">
                <div class="relative flex items-center">
                    <input type="text" id="chatInput" placeholder="Ask about the weather..." class="w-full bg-white/80 dark:bg-slate-800/80 border border-slate-200 dark:border-slate-600 rounded-full py-3 pl-4 pr-12 focus:outline-none focus:ring-2 focus:ring-blue-400 text-sm shadow-inner transition-colors text-slate-800 dark:text-slate-100">
                    <button id="sendChatBtn" class="absolute right-1.5 w-9 h-9 bg-blue-600 hover:bg-blue-700 text-white rounded-full flex items-center justify-center transition-colors shadow-md cursor-pointer">
                        <i class="fa-solid fa-paper-plane text-xs"></i>
                    </button>
                </div>
            </div>
        </div>
    </main>

    <footer class="w-full py-6 mt-auto text-center z-10 flex flex-col items-center gap-3">
        <p class="text-sm text-slate-500 dark:text-slate-400 font-medium tracking-wide">Developed by GeoffreyTheDev</p>
        <a href="https://github.com/GeoffreyTheDev" target="_blank" rel="noopener noreferrer" class="text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white transition-all duration-300 text-2xl flex items-center justify-center w-10 h-10 rounded-full bg-white/50 dark:bg-slate-800/50 shadow-sm hover:shadow-md hover:-translate-y-1">
            <i class="fa-brands fa-github"></i>
        </a>
    </footer>

    <div id="dayModal" class="modal-overlay">
        <div class="glass-panel rounded-3xl p-8 max-w-sm w-[90%] mx-auto transform scale-95 transition-transform duration-300 relative text-slate-800 dark:text-slate-100" style="--glass-bg: theme('colors.glass'); --glass-border: theme('colors.glassBorder');">
            <button id="closeModalBtn" class="absolute top-5 right-5 w-8 h-8 flex items-center justify-center rounded-full bg-slate-200/60 dark:bg-slate-700/60 hover:bg-slate-300/60 dark:hover:bg-slate-600/60 transition-colors cursor-pointer">
                <i class="fa-solid fa-xmark text-slate-600 dark:text-slate-300"></i>
            </button>
            <div class="text-center mt-2">
                <h3 id="modalDate" class="text-xl font-bold mb-1 text-slate-800 dark:text-white">Date</h3>
                <p id="modalDayName" class="text-slate-500 dark:text-slate-400 mb-6 font-medium">Day</p>
                
                <div class="bg-white/40 dark:bg-slate-800/40 rounded-full w-32 h-32 mx-auto flex items-center justify-center mb-6 shadow-inner border border-white/50 dark:border-slate-700">
                   <i id="modalIcon" class="fa-solid fa-sun text-yellow-400 text-6xl drop-shadow-lg"></i>
                </div>
                
                <div class="flex justify-center items-end gap-6 mb-6 bg-white/30 dark:bg-slate-800/30 py-4 px-6 rounded-2xl border border-white/40 dark:border-slate-700/50">
                    <div class="flex flex-col items-center">
                        <span class="text-[10px] text-slate-500 uppercase tracking-widest font-bold mb-1">High</span>
                        <span id="modalMaxTemp" class="text-4xl font-bold text-slate-800 dark:text-white">--°</span>
                    </div>
                    <div class="w-px h-10 bg-slate-300 dark:bg-slate-600"></div>
                    <div class="flex flex-col items-center">
                        <span class="text-[10px] text-slate-500 uppercase tracking-widest font-bold mb-1">Low</span>
                        <span id="modalMinTemp" class="text-4xl font-bold text-slate-400">--°</span>
                    </div>
                </div>
                
                <p id="modalDesc" class="text-sm font-bold tracking-wide uppercase bg-blue-100 dark:bg-blue-900/60 text-blue-800 dark:text-blue-200 py-2.5 px-6 rounded-full inline-block shadow-sm">Condition</p>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // PASTE YOUR CLOUDFLARE WORKER URL BELOW:
            const WORKER_URL = "https://lively-recipe-8f0c.geoffreythedev.workers.dev";

            const themeToggleBtn = document.getElementById('themeToggle');
            const themeIcon = document.getElementById('themeIcon');
            
            function applyThemeMode(isDark) {
                const panels = document.querySelectorAll('.glass-panel');
                if (isDark) {
                    document.body.classList.add('dark');
                    themeIcon.classList.replace('fa-moon', 'fa-sun');
                    themeIcon.classList.replace('text-slate-600', 'text-yellow-400');
                    panels.forEach(p => {
                        p.style.setProperty('--glass-bg', 'rgba(30, 41, 59, 0.75)');
                        p.style.setProperty('--glass-border', 'rgba(255, 255, 255, 0.1)');
                    });
                } else {
                    document.body.classList.remove('dark');
                    themeIcon.classList.replace('fa-sun', 'fa-moon');
                    themeIcon.classList.replace('text-yellow-400', 'text-slate-600');
                    panels.forEach(p => {
                        p.style.setProperty('--glass-bg', 'rgba(255, 255, 255, 0.75)');
                        p.style.setProperty('--glass-border', 'rgba(255, 255, 255, 0.6)');
                    });
                }
            }

            let isDarkMode = false;
            try {
                const savedTheme = localStorage.getItem('theme');
                const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                isDarkMode = savedTheme === 'dark' || (!savedTheme && systemPrefersDark);
            } catch (error) {}
            applyThemeMode(isDarkMode);

            themeToggleBtn.addEventListener('click', () => {
                isDarkMode = !isDarkMode;
                try { localStorage.setItem('theme', isDarkMode ? 'dark' : 'light'); } catch(e){}
                applyThemeMode(isDarkMode);
            });

            document.getElementById('currentDate').innerText = new Date().toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

            const cityInput = document.getElementById('cityInput');
            const searchBtn = document.getElementById('searchBtn');
            const forecastContainer = document.getElementById('forecastContainer');
            const weatherBg = document.getElementById('weatherBg');
            let currentForecastData = [];

            async function getCoordinates(city) {
                try {
                    const response = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1&language=en&format=json`);
                    const data = await response.json();
                    return data.results && data.results.length > 0 ? data.results[0] : null;
                } catch (error) { return null; }
            }

            function getWeatherDetails(code) {
                const weatherMap = {
                    0: { desc: 'Clear Sky', icon: 'fa-sun', color: 'text-yellow-400' },
                    1: { desc: 'Mainly Clear', icon: 'fa-sun', color: 'text-yellow-400' },
                    2: { desc: 'Partly Cloudy', icon: 'fa-cloud-sun', color: 'text-slate-400' },
                    3: { desc: 'Overcast', icon: 'fa-cloud', color: 'text-slate-500' },
                    45: { desc: 'Fog', icon: 'fa-smog', color: 'text-slate-400' },
                    48: { desc: 'Rime Fog', icon: 'fa-smog', color: 'text-slate-400' },
                    51: { desc: 'Light Drizzle', icon: 'fa-cloud-rain', color: 'text-blue-400' },
                    53: { desc: 'Drizzle', icon: 'fa-cloud-rain', color: 'text-blue-400' },
                    55: { desc: 'Dense Drizzle', icon: 'fa-cloud-rain', color: 'text-blue-500' },
                    61: { desc: 'Light Rain', icon: 'fa-cloud-rain', color: 'text-blue-400' },
                    63: { desc: 'Rain', icon: 'fa-cloud-showers-heavy', color: 'text-blue-500' },
                    65: { desc: 'Heavy Rain', icon: 'fa-cloud-showers-heavy', color: 'text-blue-600' },
                    71: { desc: 'Light Snow', icon: 'fa-snowflake', color: 'text-blue-200' },
                    73: { desc: 'Snow', icon: 'fa-snowflake', color: 'text-blue-200' },
                    75: { desc: 'Heavy Snow', icon: 'fa-snowflake', color: 'text-blue-200' },
                    95: { desc: 'Thunderstorm', icon: 'fa-cloud-bolt', color: 'text-purple-500' }
                };
                return weatherMap[code] || { desc: 'Unknown', icon: 'fa-cloud', color: 'text-slate-400' };
            }

            async function fetchWeather(lat, lon, cityName, country) {
                try {
                    document.getElementById('currentTemp').innerHTML = '<div class="loader"></div>';
                    
                    const response = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=auto`);
                    if(!response.ok) throw new Error("API failed");
                    const data = await response.json();
                    
                    const current = data.current;
                    const details = getWeatherDetails(current.weather_code);
                    
                    document.getElementById('cityName').innerText = cityName;
                    document.getElementById('countryName').innerText = country || "";
                    document.getElementById('currentTemp').innerHTML = `${Math.round(current.temperature_2m)}°<span class="text-3xl text-slate-400 font-normal">C</span>`;
                    document.getElementById('windSpeed').innerText = `${Math.round(current.wind_speed_10m)} km/h`;
                    document.getElementById('humidity').innerText = `${current.relative_humidity_2m}%`;
                    document.getElementById('weatherDescription').innerText = details.desc;
                    
                    document.getElementById('mainWeatherIcon').className = `fa-solid ${details.icon} ${details.color} text-[70px] drop-shadow-lg mb-2 transition-all duration-300`;

                    forecastContainer.innerHTML = '';
                    currentForecastData = [];
                    const daily = data.daily;

                    for (let i = 0; i < 7; i++) {
                        const dateObj = new Date(daily.time[i]);
                        const dayName = i === 0 ? 'Today' : dateObj.toLocaleDateString('en-US', { weekday: 'short' });
                        const fullDate = dateObj.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
                        const fDetails = getWeatherDetails(daily.weather_code[i]);
                        const max = Math.round(daily.temperature_2m_max[i]);
                        const min = Math.round(daily.temperature_2m_min[i]);

                        currentForecastData.push({ dayName, fullDate, max, min, details: fDetails });

                        const item = document.createElement('div');
                        item.className = 'flex flex-col items-center bg-white/50 dark:bg-slate-700/50 rounded-2xl p-3 min-w-[70px] cursor-pointer hover:bg-white/80 dark:hover:bg-slate-600/80 transition-all duration-300 border border-white/40 dark:border-slate-600/40 shadow-sm hover:shadow-md hover:-translate-y-1';
                        item.onclick = () => openModal(i);

                        item.innerHTML = `
                            <span class="text-xs font-bold mb-1.5 text-slate-700 dark:text-slate-300">${dayName}</span>
                            <i class="fa-solid ${fDetails.icon} ${fDetails.color} text-xl mb-1.5 drop-shadow-sm"></i>
                            <div class="flex flex-col items-center text-xs gap-0.5">
                                <span class="font-bold text-slate-800 dark:text-white">${max}°</span>
                                <span class="text-slate-500 dark:text-slate-400 font-medium">${min}°</span>
                            </div>
                        `;
                        forecastContainer.appendChild(item);
                    }

                    document.querySelectorAll('.rain').forEach(e => e.remove());

                } catch (error) {
                    document.getElementById('cityName').innerText = "Windhoek";
                    document.getElementById('countryName').innerText = "Namibia";
                    document.getElementById('currentTemp').innerHTML = "29°<span class='text-3xl text-slate-400 font-normal'>C</span>";
                    document.getElementById('windSpeed').innerText = "12 km/h";
                    document.getElementById('humidity').innerText = "25%";
                    document.getElementById('weatherDescription').innerText = "Clear Sky";
                }
            }

            async function handleSearch() {
                const query = cityInput.value.trim();
                if (!query) return;
                const location = await getCoordinates(query);
                if (location) {
                    fetchWeather(location.latitude, location.longitude, location.name, location.country);
                    cityInput.value = '';
                } else { alert("City not found."); }
            }

            searchBtn.addEventListener('click', handleSearch);
            cityInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') handleSearch(); });

            fetchWeather(-22.5594, 17.0832, "Windhoek", "Namibia");

            // Modal logic
            const modal = document.getElementById('dayModal');
            const modalContent = modal.querySelector('.glass-panel');
            const closeBtn = document.getElementById('closeModalBtn');

            function openModal(index) {
                const data = currentForecastData[index];
                if(!data) return;
                document.getElementById('modalDate').innerText = data.fullDate;
                document.getElementById('modalDayName').innerText = data.dayName;
                document.getElementById('modalIcon').className = `fa-solid ${data.details.icon} ${data.details.color} text-[70px] drop-shadow-lg`;
                document.getElementById('modalMaxTemp').innerText = `${data.max}°`;
                document.getElementById('modalMinTemp').innerText = `${data.min}°`;
                document.getElementById('modalDesc').innerText = data.details.desc;

                modalContent.style.setProperty('--glass-bg', document.body.classList.contains('dark') ? 'rgba(30, 41, 59, 0.95)' : 'rgba(255, 255, 255, 0.95)');
                modal.classList.add('active');
                setTimeout(() => { modalContent.style.transform = 'scale(1)'; }, 10);
            }

            function closeModal() {
                modalContent.style.transform = 'scale(0.95)';
                setTimeout(() => { modal.classList.remove('active'); }, 300);
            }

            closeBtn.addEventListener('click', closeModal);
            modal.addEventListener('click', (e) => { if(e.target === modal) closeModal(); });

            // --- Secure Cloudflare AI Chat ---
            const chatInput = document.getElementById('chatInput');
            const sendChatBtn = document.getElementById('sendChatBtn');
            const chatArea = document.getElementById('chatArea');
            let isWaitingForAI = false;

            function addMessage(text, isUser = false) {
                const msgDiv = document.createElement('div');
                msgDiv.className = `flex gap-3 max-w-[85%] ${isUser ? 'ml-auto flex-row-reverse' : ''}`;
                const avatar = isUser 
                    ? `<div class="w-8 h-8 rounded-full bg-slate-200 dark:bg-slate-600 flex-shrink-0 flex items-center justify-center shadow-sm"><i class="fa-solid fa-user text-slate-500 dark:text-slate-300 text-xs"></i></div>`
                    : `<div class="w-8 h-8 rounded-full bg-blue-500 flex-shrink-0 flex items-center justify-center shadow-sm"><i class="fa-solid fa-robot text-white text-xs"></i></div>`;
                const radiusClass = isUser ? 'rounded-tr-none bg-blue-600 text-white border-blue-500' : 'rounded-tl-none bg-white/90 dark:bg-slate-700/90 text-slate-700 dark:text-slate-200 border-white/50 dark:border-slate-600/50';
                
                msgDiv.innerHTML = `${avatar}<div class="message-bubble p-3.5 rounded-2xl shadow-sm text-sm border leading-relaxed ${radiusClass}">${isUser ? text : ''}</div>`;
                chatArea.appendChild(msgDiv);
                chatArea.scrollTop = chatArea.scrollHeight;
                return msgDiv.querySelector('.message-bubble');
            }

            async function typeMessage(element, text, speed = 15) {
                element.innerHTML = '';
                let i = 0;
                return new Promise(resolve => {
                    function typeChar() {
                        if (i < text.length) {
                            element.innerHTML += text.charAt(i);
                            i++;
                            chatArea.scrollTop = chatArea.scrollHeight;
                            setTimeout(typeChar, speed);
                        } else { resolve(); }
                    }
                    typeChar();
                });
            }

            async function handleChat() {
                if (isWaitingForAI || !chatInput.value.trim()) return;

                const userText = chatInput.value.trim();
                addMessage(userText, true);
                chatInput.value = '';
                isWaitingForAI = true;
                
                const aiBubble = addMessage("...");
                
                try {
                    const city = document.getElementById('cityName').innerText;
                    const desc = document.getElementById('weatherDescription').innerText;
                    const temp = document.getElementById('currentTemp').innerText;

                    const response = await fetch(WORKER_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ message: userText, city, temp, weatherDesc: desc })
                    });

                    if (!response.ok) throw new Error("Worker request failed");
                    const data = await response.json();
                    
                    await typeMessage(aiBubble, data.reply.replace(/\n/g, '<br>'));
                } catch (error) {
                    await typeMessage(aiBubble, "I'm sorry, I couldn't connect to my secure worker node. Please try again.");
                } finally {
                    isWaitingForAI = false;
                }
            }

            sendChatBtn.addEventListener('click', handleChat);
            chatInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') handleChat(); });
        });
    </script>
</body>
</html>
